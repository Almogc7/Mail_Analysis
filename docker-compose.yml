# docker compose up --build        then open http://localhost:8000
services:
  mail-analysis:
    build:
      context: .
    image: mail-analysis:local
    # Localhost only. The app has NO login: never publish it on a network until authentication is added.
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      # .env (API keys, TRUSTED_RECEIVER_PATTERNS), brands.local.json, known_senders.local.json: copy from deploy/team-config.example
      - ./team-config:/config:ro
      # the analyst feedback log survives restarts
      - mail-analysis-data:/data
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
volumes:
  mail-analysis-data:
